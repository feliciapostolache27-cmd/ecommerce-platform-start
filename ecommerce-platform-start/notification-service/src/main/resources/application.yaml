spring:
  application:
    name: notification-service
  main:
    web-application-type: none   # nu porneste server web; doar consuma mesaje

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest   # la prima pornire citeste si mesajele trimise inainte
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: un mesaj corupt este sarit, nu blocheaza consumatorul
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.notification.event.TaskCreatedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.notification.event

app:
  kafka:
    topics:
      task-created: task-created
