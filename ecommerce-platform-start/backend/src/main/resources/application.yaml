spring:
  application:
    name: ecommerce-backend

  datasource:
    # Valorile de dupa ":" sunt cele implicite (dezvoltare locala). In Docker se suprascriu prin variabile de mediu.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}

  jpa:
    hibernate:
      # update = Hibernate creeaza/actualizeaza tabelele dupa entitati (bun pentru invatare).
      # Mai tarziu il inlocuim cu migrari (Flyway) si ddl-auto: validate.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # nu trimitem numele clasei Java in header: consumatorul (alt serviciu) are propria clasa
        spring.json.add.type.headers: false
        # daca Kafka nu raspunde, send() nu blocheaza cererea HTTP mai mult de 3 secunde
        max.block.ms: 3000

server:
  port: 8080

app:
  jwt:
    # Cheia de semnare (minim 32 de caractere). In productie vine DOAR din variabila de mediu JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration-ms: 3600000   # 1 ora
  admin:
    # Cont ADMIN creat automat la prima pornire (doar pentru dezvoltare).
    email: ${ADMIN_EMAIL:admin@shop.local}
    password: ${ADMIN_PASSWORD:admin123}
  kafka:
    topics:
      task-created: task-created
  cors:
    # Originile care au voie sa apeleze API-ul. "null" = frontend deschis direct din fisier (dublu-click pe index.html).
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:4200,null
